name: latest

# No pkgver: whatever Arch currently ships, which is the kernel most people
# hitting this repo are actually running.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    uses: ./.github/workflows/build-kernel.yml
