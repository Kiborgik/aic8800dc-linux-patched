name: build

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

jobs:
  scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: install.sh + test.sh + uninstall.sh
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            dkms build-essential linux-headers-$(uname -r) eject
          chmod +x install.sh test.sh uninstall.sh
          sudo ./install.sh
          sudo ./test.sh | tee test.log
          grep -qE 'Result: [0-9]+ passed, 0 failed' test.log
          sudo ./uninstall.sh

  build:
    runs-on: ubuntu-latest
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: 6.12 LTS
            pkgver: 6.12.1.arch1-1
          - name: 7.1 stable
            pkgver: 7.1.2.arch3-1
          - name: latest
            pkgver: ""
    steps:
      - uses: actions/checkout@v7
      - name: dkms build
        env:
          PKGVER: ${{ matrix.pkgver }}
        run: |
          docker run --rm -e PKGVER -v "$PWD:/src:ro" archlinux:latest bash -c '
            set -e
            pacman -Syu --noconfirm --needed base-devel bc kmod dkms curl
            if [ -n "$PKGVER" ]; then
              curl -fsSL -o /tmp/h.pkg.tar.zst \
                "https://archive.archlinux.org/packages/l/linux-headers/linux-headers-$PKGVER-x86_64.pkg.tar.zst"
              pacman -U --noconfirm /tmp/h.pkg.tar.zst
            else
              pacman -S --noconfirm linux-headers
            fi
            kver=$(ls -1 /usr/lib/modules | head -1)
            . /src/dkms.conf
            mkdir -p "/usr/src/$PACKAGE_NAME-$PACKAGE_VERSION"
            cp -a /src/. "/usr/src/$PACKAGE_NAME-$PACKAGE_VERSION/"
            dkms add   -m "$PACKAGE_NAME" -v "$PACKAGE_VERSION"
            dkms build -m "$PACKAGE_NAME" -v "$PACKAGE_VERSION" -k "$kver"
          '

  # Early warning only: mainline -rc breaks us weeks before Arch ships the final
  # release, but an -rc can also be broken on its own, so this must never gate a
  # merge. Fedora Rawhide is used because it packages mainline -rc kernel-devel,
  # which avoids compiling a kernel just to get headers.
  rc:
    runs-on: ubuntu-latest
    name: mainline rc
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - name: dkms build
        run: |
          docker run --rm -v "$PWD:/src:ro" fedora:rawhide bash -c '
            set -e
            dnf -y install kernel-devel dkms gcc make bc kmod
            kver=$(ls -1 /usr/src/kernels | head -1)
            echo "building against $kver"
            . /src/dkms.conf
            mkdir -p "/usr/src/$PACKAGE_NAME-$PACKAGE_VERSION"
            cp -a /src/. "/usr/src/$PACKAGE_NAME-$PACKAGE_VERSION/"
            dkms add   -m "$PACKAGE_NAME" -v "$PACKAGE_VERSION"
            dkms build -m "$PACKAGE_NAME" -v "$PACKAGE_VERSION" -k "$kver" \
              --kernelsourcedir "/usr/src/kernels/$kver"
          '
